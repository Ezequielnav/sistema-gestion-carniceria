{# Formulario de filtro de los listados: fechas (DEC-145) y un campo más, con sus errores. #}
<form method="get" class="mt-6 grid gap-3 sm:grid-cols-[repeat(3,minmax(0,12rem))_auto] sm:items-end" novalidate>
  {% for campo in form %}
    <div>
      <label for="{{ campo.id_for_label }}" class="etiqueta">{{ campo.label }}</label>
      {{ campo }}
      {% for error in campo.errors %}<p class="error-campo">{{ error }}</p>{% endfor %}
    </div>
  {% endfor %}
  <button type="submit" class="boton boton-secundario min-h-11 justify-self-start">Filtrar</button>
</form>
